# ============================
# Datos de la aplicacion
# ============================
spring.application.name=plataforma-educativa-virtual
server.port=8080

# ============================
# Conexion a PostgreSQL
# ============================
spring.datasource.url=jdbc:postgresql://localhost:5432/plataforma_educativa
spring.datasource.username=postgres
spring.datasource.password=Hug0Roda11ega.
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# ============================
# update: crea/ajusta tablas automaticamente segun las entidades (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================
# JWT (clave y expiracion del token)
# ============================
app.jwt.secret=cambia_esta_clave_por_una_generada_de_al_menos_256_bits
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000